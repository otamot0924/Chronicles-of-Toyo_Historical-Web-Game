<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東瀛紀事</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="start-screen">
        <div id="start-icon"></div>
        <button id="start-button">
            <span class="button-text">開始遊戲</span>
        </button>
    </div>

    <div id="scene-transition-mask"></div>

    <div id="game-content" style="display: none;">

        <div id="loading-screen" style="display: none;">            
            <div id="loading-bar-moving-img">
            </div>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
        </div>

        <div id="scene-container">
            <div id="scene-right-button"></div>
            <div id="scene-left-button"></div>
            <div id="item-layer"></div>
        </div>

        <div id="dialogue-container">
            <div id="npc-portrait-container">
                <img id="npc-portrait" alt="NPC", loading="lazy">
            </div>
            
            <div id="dialogue-box">
                <div id="npc-name"></div>
                <p id="dialogue-text"></p>
                <div class="next-indicator">▼</div>
            </div>
        </div>

        <div id="game-over-screen" style="display: none;">
            <div id="game-over-text">遊戲結束</div>
            <button id="restart-button" onclick="location.reload()">重新開始</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
